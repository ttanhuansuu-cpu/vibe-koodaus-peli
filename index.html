/Player.h`,name:`Player.h`,category:`header`,description:`Pelaajan kinematiikka, hyppylogiikka, 2-kuution power-up -tila ja osumalaatikko`,content:`// Player.h - Android Studio C++20 NDK
#pragma once
#include <string>
#include <vector>
#include <algorithm>

enum class PowerUpType {
    NONE = 0,
    DOUBLE_JUMP,
    HIGH_JUMP,
    SHIELD,
    SUPER_DASH
};

struct RectF {
    float x;
    float y;
    float width;
    float height;

    bool intersects(const RectF& other) const {
        return x < other.x + other.width &&
               x + width > other.x &&
               y < other.y + other.height &&
               y + height > other.y;
    }
};

class Player {
public:
    RectF bounds{50.0f, 450.0f, 28.0f, 38.0f};
    float vx = 0.0f;
    float vy = 0.0f;
    bool isGrounded = false;
    int facing = 1; // 1 = oikealle, -1 = vasemmalle

    // Hyppy ja coyote-time
    float jumpStrength = 460.0f;
    int jumpCount = 0;
    int maxJumps = 1;
    float coyoteTimer = 0.0f;
    float jumpBufferTimer = 0.0f;

    // Power-Up -mekaniikka (2-kuution sääntö)
    int cubesBrokenCount = 0; // Kasvaa kahteen (2), laukaisee voiman ja nollautuu!
    int totalCubesBroken = 0;
    PowerUpType activePowerUp = PowerUpType::NONE;
    float powerUpTimer = 0.0f;
    bool hasShield = false;

    // Syöksy (Dash)
    bool isDashing = false;
    float dashTimer = 0.0f;
    float dashCooldown = 0.0f;

    // Elämät, pisteet ja korkeus
    int lives = 3;
    int maxLives = 3;
    int score = 0;
    int enemiesStomped = 0;
    float altitudeMeters = 0.0f;
    float invulnerableTimer = 0.0f;

    void update(float dt, float groundY);
    void move(float dir);
    void jump();
    void releaseJump();
    void dash();
    void onUndersideCubeHit();
    void applyPowerUp(PowerUpType type, float duration);
};

#include "Player.h"
#include <cmath>
#include <algorithm>

void Player::update(float dt, float groundY) {
    // 1. Korkeuden mittaus (noustaessa Y pienenee)
    float heightClimbed = std::max(0.0f, groundY - bounds.y);
    altitudeMeters = std::floor(heightClimbed / 50.0f);

    // 2. Ajastimien päivitys
    if (invulnerableTimer > 0.0f) invulnerableTimer -= dt;
    if (dashCooldown > 0.0f) dashCooldown -= dt;
    if (jumpBufferTimer > 0.0f) jumpBufferTimer -= dt;

    if (isGrounded) {
        coyoteTimer = 0.10f;
        jumpCount = 0;
    } else {
        coyoteTimer = std::max(0.0f, coyoteTimer - dt);
    }

    // Power-upit ovat PYSYVIÄ: kyvyt pysyvät aktiivisina koko pelin ajan!
    // (Tuplahyppy ja korkeushyppy eivät vanhene)

    // Syöksyn fysiikka
    if (isDashing) {
        dashTimer -= dt;
        if (dashTimer <= 0.0f) isDashing = false;
    }

    // Painovoima
    float gravity = isDashing ? 0.0f : 960.0f;
    vy += gravity * dt;
    if (vy > 750.0f) vy = 750.0f; // Maksiminopeus alaspäin

    // Sijainnin päivitys
    bounds.x += vx * dt;
    bounds.y += vy * dt;
}

void Player::move(float dir) {
    if (isDashing) return;
    float maxSpeed = 240.0f;
    if (std::abs(dir) > 0.1f) {
        vx = dir * maxSpeed;
        facing = (dir > 0) ? 1 : -1;
    } else {
        vx *= 0.8f; // Kitka
    }
}

void Player::jump() {
    bool canGroundJump = isGrounded || coyoteTimer > 0.0f;
    bool canAirJump = !canGroundJump && (activePowerUp == PowerUpType::DOUBLE_JUMP) && (jumpCount < maxJumps);

    if (canGroundJump) {
        vy = -jumpStrength;
        isGrounded = false;
        coyoteTimer = 0.0f;
        jumpCount = 1;
    } else if (canAirJump) {
        vy = -jumpStrength * 0.95f;
        jumpCount++;
    }
}

void Player::releaseJump() {
    // Säätyvä hyppykorkeus
    if (vy < -60.0f) {
        vy *= 0.52f;
    }
}

void Player::dash() {
    if (dashCooldown <= 0.0f) {
        isDashing = true;
        dashTimer = (activePowerUp == PowerUpType::SUPER_DASH) ? 0.28f : 0.18f;
        dashCooldown = 0.6f;
        vx = facing * ((activePowerUp == PowerUpType::SUPER_DASH) ? 720.0f : 540.0f);
        vy = -30.0f;
    }
}

void Player::onUndersideCubeHit() {
    // Pääpusku: pelaaja kimpoaa hieman alaspäin
    vy = std::max(60.0f, -vy * 0.2f);
    totalCubesBroken++;
    score += 200;

    // Ydinvaatimus: 2 rikottua kuutiota aktivoi satunnaisen tai rotaation mukaisen power-upin!
    cubesBrokenCount++;
    if (cubesBrokenCount >= 2) {
        cubesBrokenCount = 0; // Nollataan laskuri 2 kuution jälkeen
        // Rotaatio: Double Jump -> Spring Boots -> Shield -> Super Dash
        static int powerCycle = 0;
        PowerUpType types[] = {
            PowerUpType::DOUBLE_JUMP,
            PowerUpType::HIGH_JUMP,
            PowerUpType::SHIELD,
            PowerUpType::SUPER_DASH
        };
        applyPowerUp(types[powerCycle % 4], 18.0f);
        powerCycle++;
    }
}

void Player::applyPowerUp(PowerUpType type, float duration) {
    activePowerUp = type;
    powerUpTimer = duration;

    if (type == PowerUpType::DOUBLE_JUMP) {
        maxJumps = 2;
    } else if (type == PowerUpType::HIGH_JUMP) {
        jumpStrength = 630.0f; // +40% korkeampi hyppy
    } else if (type == PowerUpType::SHIELD) {
        hasShield = true;
    }
}

#pragma once
#include "Player.h"

class PowerUpCube {
public:
    RectF bounds;
    bool isBroken = false;
    float hitAnimTimer = 0.0f;

    PowerUpCube(float x, float y, float w = 38.0f, float h = 38.0f)
        : bounds{x, y, w, h} {}

    // Tarkistaa osuko pelaaja kuutioon alapuolelta hyppäämällä
    bool checkUndersideHit(const Player& player) const {
        if (isBroken) return false;

        // Pelaajan täytyy liikkua ylöspäin
        if (player.vy > 80.0f) return false;

        // Vaakasuuntainen limitys
        bool xOverlap = (player.bounds.x + player.bounds.width > bounds.x + 2.0f) &&
                        (player.bounds.x < bounds.x + bounds.width - 2.0f);
        if (!xOverlap) return false;

        // Pelaajan pää osuu kuution alapintaan
        float cubeBottom = bounds.y + bounds.height;
        float playerTop = player.bounds.y;

        return (playerTop <= cubeBottom + 12.0f && playerTop >= bounds.y + 4.0f);
    }

    void triggerBreak(Player& player) {
        if (isBroken) return;
        isBroken = true;
        hitAnimTimer = 0.35f;
        player.onUndersideCubeHit();
    }
};

class Enemy {
public:
    RectF bounds;
    float vx = 60.0f;
    float minX = 0.0f;
    float maxX = 0.0f;
    bool isAlive = true;
    float squishTimer = 0.0f;

    Enemy(float x, float y, float min_x, float max_x, float speed = 60.0f)
        : bounds{x, y, 36.0f, 32.0f}, vx(speed), minX(min_x), maxX(max_x) {}

    void update(float dt);
    // Palauttaa: 1 = Pelaaja polki vihollisen, 2 = Vihollinen osui pelaajaan, 0 = Ei osumaa
    int checkCollision(Player& player);
};

#include "Enemy.h"
#include <cmath>

void Enemy::update(float dt) {
    if (!isAlive) {
        if (squishTimer > 0.0f) squishTimer -= dt;
        return;
    }

    bounds.x += vx * dt;
    if (bounds.x <= minX) {
        bounds.x = minX;
        vx = std::abs(vx);
    } else if (bounds.x + bounds.width >= maxX) {
        bounds.x = maxX - bounds.width;
        vx = -std::abs(vx);
    }
}

int Enemy::checkCollision(Player& player) {
    if (!isAlive || !bounds.intersects(player.bounds)) return 0;

    float playerFeet = player.bounds.y + player.bounds.height;
    float enemyStompBoundary = bounds.y + bounds.height * 0.45f;

    // Poljenta: pelaaja putoaa ja jalat osuvat vihollisen yläosaan
    if (player.vy > -30.0f && playerFeet <= enemyStompBoundary + 12.0f) {
        isAlive = false;
        squishTimer = 0.35f;
        player.vy = -430.0f; // Voimakas ponnahdus ylös!
        player.score += 350;
        player.enemiesStomped++;
        return 1; // Poljettu onnistuneesti!
    }

    // Pelaaja ottaa osuman
    if (player.invulnerableTimer <= 0.0f && !player.isDashing) {
        if (player.hasShield) {
            player.hasShield = false;
            player.invulnerableTimer = 1.5f;
        } else {
            player.lives--;
            player.invulnerableTimer = 2.0f;
            player.vy = -260.0f;
            player.vx = -player.facing * 180.0f;
        }
        return 2; // Vahinko
    }

    return 0;
}

#pragma once
#include "Player.h"

enum class ObstacleType {
    BUZZSAW,
    PLASMA_ORB
};

class Obstacle {
public:
    ObstacleType type = ObstacleType::BUZZSAW;
    float x = 0.0f;
    float y = 0.0f;
    float radius = 20.0f;
    float baseVx = 70.0f;
    float vx = 70.0f;
    float minX = 0.0f;
    float maxX = 0.0f;
    float angle = 0.0f;

    Obstacle(ObstacleType t, float startX, float startY, float r, float speed, float min_x, float max_x)
        : type(t), x(startX), y(startY), radius(r), baseVx(speed), vx(speed), minX(min_x), maxX(max_x) {}

    void update(float dt, float altitudeMultiplier) {
        // Nopeus skaalautuu korkeuden mukaan (vaikeampi mitä korkeammalla kiipeää)
        vx = (baseVx >= 0 ? 1.0f : -1.0f) * std::abs(baseVx) * altitudeMultiplier;
        x += vx * dt;

        if (x >= maxX) {
            x = maxX;
            baseVx = -std::abs(baseVx);
        } else if (x <= minX) {
            x = minX;
            baseVx = std::abs(baseVx);
        }

        angle += 12.0f * altitudeMultiplier * dt;
    }

    bool checkPlayerCollision(Player& player) const {
        // Ympyrä vs Suorakulmio -törmäystarkistus
        float closestX = std::max(player.bounds.x, std::min(x, player.bounds.x + player.bounds.width));
        float closestY = std::max(player.bounds.y, std::min(y, player.bounds.y + player.bounds.height));
        float dx = x - closestX;
        float dy = y - closestY;
        return (dx * dx + dy * dy) < (radius * radius);
    }
};

#pragma once
#include "Player.h"

enum class PlatformType {
    NORMAL,
    GROUND,
    VERTICAL_LIFT,
    MOVING_H,
    FINISH
};

struct Platform {
    RectF bounds;
    PlatformType type = PlatformType::NORMAL;
    float vx = 0.0f;
    float vy = 0.0f;
    float minX = 0.0f, maxX = 0.0f;
    float minY = 0.0f, maxY = 0.0f;
};

class Level {
public:
    float groundY = 500.0f;
    float summitY = -3500.0f; // Korkeuden huippu (Goal)
    std::vector<Platform> platforms;
    std::vector<PowerUpCube> cubes;
    std::vector<Enemy> enemies;
    std::vector<Obstacle> obstacles;

    void loadStage1() {
        platforms.clear();
        cubes.clear();
        enemies.clear();
        obstacles.clear();

        // 1. VAAKAOSIO (x: 0 -> 1250)
        platforms.push_back({ {0.0f, groundY, 600.0f, 60.0f}, PlatformType::GROUND });
        platforms.push_back({ {550.0f, groundY, 700.0f, 60.0f}, PlatformType::GROUND });
        platforms.push_back({ {240.0f, 380.0f, 150.0f, 24.0f}, PlatformType::NORMAL });
        platforms.push_back({ {670.0f, 360.0f, 160.0f, 24.0f}, PlatformType::NORMAL });

        // Kuutiot tasojen alla (alapuolelta puskettavaksi!)
        cubes.push_back(PowerUpCube(290.0f, 404.0f));
        cubes.push_back(PowerUpCube(720.0f, 384.0f));

        // Partioivat viholliset
        enemies.push_back(Enemy(480.0f, groundY - 32.0f, 400.0f, 540.0f));
        enemies.push_back(Enemy(750.0f, groundY - 32.0f, 660.0f, 840.0f));

        // 2. PYSTYNOUSU (Vertical Ascent, y: 100 -> -3500)
        // Hissit (Vertical lifts)
        Platform lift1{ {1200.0f, 0.0f, 110.0f, 22.0f}, PlatformType::VERTICAL_LIFT, 0.0f, -70.0f, 0.0f, 0.0f, -220.0f, 30.0f };
        platforms.push_back(lift1);

        Platform lift2{ {960.0f, -820.0f, 110.0f, 22.0f}, PlatformType::VERTICAL_LIFT, 0.0f, -90.0f, 0.0f, 0.0f, -1100.0f, -800.0f };
        platforms.push_back(lift2);

        // Pystytasot
        platforms.push_back({ {920.0f, -240.0f, 160.0f, 24.0f}, PlatformType::NORMAL });
        platforms.push_back({ {1220.0f, -360.0f, 170.0f, 24.0f}, PlatformType::NORMAL });
        platforms.push_back({ {1180.0f, -1120.0f, 150.0f, 24.0f}, PlatformType::NORMAL });
        platforms.push_back({ {940.0f, -2220.0f, 140.0f, 24.0f}, PlatformType::NORMAL });

        // Kuutiot pystynousussa
        cubes.push_back(PowerUpCube(970.0f, -216.0f));
        cubes.push_back(PowerUpCube(1270.0f, -336.0f));
        cubes.push_back(PowerUpCube(1220.0f, -1096.0f));

        // Vaikeutuvat liikkuvat esteet (sirkkelit kiihtyvät korkeuden mukaan)
        obstacles.push_back(Obstacle(ObstacleType::BUZZSAW, 1100.0f, -300.0f, 18.0f, 60.0f, 1000.0f, 1240.0f));
        obstacles.push_back(Obstacle(ObstacleType::BUZZSAW, 1080.0f, -1450.0f, 22.0f, -95.0f, 980.0f, 1300.0f));
        obstacles.push_back(Obstacle(ObstacleType::BUZZSAW, 1050.0f, -2150.0f, 22.0f, 110.0f, 970.0f, 1330.0f));

        // Huippu / Goal platform
        platforms.push_back({ {1050.0f, summitY, 250.0f, 32.0f}, PlatformType::FINISH });
    }
};

#include "TouchController.h"
#include <cmath>
#include <algorithm>

void TouchController::onTouchDown(int pointerId, float x, float y) {
    if (jumpBtn.intersects({x, y, 1.0f, 1.0f})) {
        jumpPressed = true;
        jumpHeld = true;
    } else if (dashBtn.intersects({x, y, 1.0f, 1.0f})) {
        dashPressed = true;
    } else if (x < 420.0f) {
        // Vasen D-pad -alue
        float cx = dpadZone.x + dpadZone.width / 2.0f;
        axisX = (x < cx) ? -1.0f : 1.0f;
    }
}

void TouchController::onTouchMove(int pointerId, float x, float y) {
    if (x < 420.0f) {
        float cx = dpadZone.x + dpadZone.width / 2.0f;
        float diff = (x - cx) / (dpadZone.width / 2.0f);
        axisX = std::max(-1.0f, std::min(1.0f, diff));
    }
}

void TouchController::onTouchUp(int pointerId, float x, float y) {
    if (jumpBtn.intersects({x, y, 1.0f, 1.0f})) {
        jumpHeld = false;
    } else if (x < 420.0f) {
        axisX = 0.0f;
    }
}

void TouchController::applyToPlayer(Player& player) {
    player.move(axisX);
    if (jumpPressed) {
        player.jump();
        jumpPressed = false;
    }
    if (!jumpHeld) {
        player.releaseJump();
    }
    if (dashPressed) {
        player.dash();
        dashPressed = false;
    }
}

#pragma once
#include "Player.h"
#include "Level.h"
#include "TouchController.h"

enum class GameState {
    MENU,
    PLAYING,
    PAUSED,
    LEVEL_SUMMARY,
    GAME_OVER
};

struct LevelSummary {
    int totalScore = 0;
    int maxAltitude = 0;
    int cubesBroken = 0;
    int enemiesStomped = 0;
    float clearTime = 0.0f;
    char rank = 'C'; // 'S', 'A', 'B', 'C'
    int stars = 1;   // 1, 2, 3
};

class GameEngine {
public:
    GameState state = GameState::MENU;
    Player player;
    Level level;
    TouchController touch;
    LevelSummary summary;
    float levelTime = 0.0f;

    void init();
    void startStage();
    void update(float dt);
    void calculateSummaryAndRank();
    float getDifficultyMultiplier() const;
};

#include "GameEngine.h"
#include <cmath>

void GameEngine::init() {
    state = GameState::MENU;
}

void GameEngine::startStage() {
    level.loadStage1();
    player = Player();
    player.bounds.x = 50.0f;
    player.bounds.y = level.groundY - 45.0f;
    levelTime = 0.0f;
    state = GameState::PLAYING;
}

float GameEngine::getDifficultyMultiplier() const {
    // Kiipeävä vaikeustaso: mitä korkeammalla pelaaja on, sitä nopeammin esteet liikkuvat
    return std::min(3.0f, 1.0f + player.altitudeMeters * 0.02f);
}

void GameEngine::update(float dt) {
    if (state != GameState::PLAYING) return;
    levelTime += dt;

    // 1. Kosketusohjainten päivitys
    touch.applyToPlayer(player);

    // 2. Pelaajan fysiikka
    player.update(dt, level.groundY);

    // 3. Esteiden päivitys skaalatulla nopeudella
    float diffMult = getDifficultyMultiplier();
    for (auto& obs : level.obstacles) {
        obs.update(dt, diffMult);
        if (obs.checkPlayerCollision(player) && player.invulnerableTimer <= 0.0f && !player.isDashing) {
            if (player.hasShield) {
                player.hasShield = false;
                player.invulnerableTimer = 1.5f;
            } else {
                player.lives--;
                player.invulnerableTimer = 2.0f;
                player.vy = -260.0f;
                if (player.lives <= 0) {
                    state = GameState::GAME_OVER;
                    return;
                }
            }
        }
    }

    // 4. Vihollisten päivitys ja poljenta
    for (auto& enemy : level.enemies) {
        enemy.update(dt);
        enemy.checkCollision(player);
        if (player.lives <= 0) {
            state = GameState::GAME_OVER;
            return;
        }
    }

    // 5. Kuutioiden tarkistus alapuolelta
    for (auto& cube : level.cubes) {
        if (!cube.isBroken && cube.checkUndersideHit(player)) {
            cube.triggerBreak(player);
        }
    }

    // 6. Tasotörmäykset ja maakosketus
    player.isGrounded = false;
    for (const auto& p : level.platforms) {
        if (player.bounds.x + player.bounds.width > p.bounds.x &&
            player.bounds.x < p.bounds.x + p.bounds.width) {
            
            float prevY = player.bounds.y - player.vy * dt;
            if (prevY + player.bounds.height <= p.bounds.y + 14.0f &&
                player.bounds.y + player.bounds.height >= p.bounds.y &&
                player.vy >= 0.0f) {
                
                player.bounds.y = p.bounds.y - player.bounds.height;
                player.vy = 0.0f;
                player.isGrounded = true;

                // Tason läpäisy huipulla!
                if (p.type == PlatformType::FINISH) {
                    calculateSummaryAndRank();
                    state = GameState::LEVEL_SUMMARY;
                    return;
                }
            }
        }
    }
}

void GameEngine::calculateSummaryAndRank() {
    int altitudeBonus = static_cast<int>(player.altitudeMeters) * 25;
    int enemyBonus = player.enemiesStomped * 200;
    int cubeBonus = player.totalCubesBroken * 150;
    int timeBonus = std::max(0, static_cast<int>((180.0f - levelTime) * 15.0f));

    summary.totalScore = player.score + altitudeBonus + enemyBonus + cubeBonus + timeBonus;
    summary.maxAltitude = static_cast<int>(player.altitudeMeters);
    summary.cubesBroken = player.totalCubesBroken;
    summary.enemiesStomped = player.enemiesStomped;
    summary.clearTime = levelTime;

    // Arvosanalogiikka
    if (summary.totalScore >= 6500 && summary.cubesBroken >= 4 && summary.enemiesStomped >= 3) {
        summary.rank = 'S';
        summary.stars = 3;
    } else if (summary.totalScore >= 4500 && summary.cubesBroken >= 2) {
        summary.rank = 'A';
        summary.stars = 3;
    } else if (summary.totalScore >= 2500) {
        summary.rank = 'B';
        summary.stars = 2;
    } else {
        summary.rank = 'C';
        summary.stars = 1;
    }
}

package com.example.cyberclimber

import android.content.Context
import android.graphics.*
import android.os.SystemClock
import android.view.MotionEvent
import android.view.View

class GameView(context: Context) : View(context) {

    private val bgPaint = Paint().apply { isAntiAlias = true }
    private val textPaint = Paint().apply {
        isAntiAlias = true
        color = Color.WHITE
        typeface = Typeface.DEFAULT_BOLD
    }
    private val buttonPaint = Paint().apply { isAntiAlias = true }
    private val buttonTextPaint = Paint().apply {
        isAntiAlias = true
        color = Color.WHITE
        typeface = Typeface.DEFAULT_BOLD
        textAlign = Paint.Align.CENTER
    }

    private var lastTimeMs: Long = 0

    init {
        isFocusable = true
        isFocusableInTouchMode = true
    }

    override fun onDraw(canvas: Canvas) {
        super.onDraw(canvas)

        val now = SystemClock.uptimeMillis()
        if (lastTimeMs == 0L) lastTimeMs = now
        val dt = Math.min((now - lastTimeMs) / 1000f, 0.05f)
        lastTimeMs = now

        // 1. Päivitä C++ -moottori
        val activity = context as? MainActivity
        activity?.nativeUpdate(dt)

        val score = activity?.nativeGetScore() ?: 0
        val rank = activity?.nativeGetRank() ?: 'B'
        val state = activity?.nativeGetState() ?: 1 // 1 = PLAYING

        val w = width.toFloat()
        val h = height.toFloat()

        // 2. Tausta (Tumma kyberavaruus ja tähtitaivas)
        canvas.drawColor(Color.parseColor("#090a16"))

        // Piirrä tähtiä taustalle
        bgPaint.color = Color.parseColor("#33ffffff")
        for (i in 0..25) {
            val sx = (i * 137.5f) % w
            val sy = (i * 89.3f) % h
            canvas.drawCircle(sx, sy, (i % 3 + 1).toFloat(), bgPaint)
        }

        // 3. Piirrä tasot (Platforms)
        bgPaint.color = Color.parseColor("#1e293b")
        // Maataso
        canvas.drawRect(0f, h - 180f, w, h, bgPaint)
        bgPaint.color = Color.parseColor("#38bdf8")
        canvas.drawRect(0f, h - 180f, w, h - 174f, bgPaint) // Neonreuna

        // Ilmatasot
        bgPaint.color = Color.parseColor("#1e293b")
        canvas.drawRoundRect(w * 0.25f, h - 340f, w * 0.45f, h - 315f, 8f, 8f, bgPaint)
        bgPaint.color = Color.parseColor("#06b6d4")
        canvas.drawRect(w * 0.25f, h - 340f, w * 0.45f, h - 336f, bgPaint)

        canvas.drawRoundRect(w * 0.55f, h - 420f, w * 0.78f, h - 395f, 8f, 8f, bgPaint)
        bgPaint.color = Color.parseColor("#eab308")
        canvas.drawRect(w * 0.55f, h - 420f, w * 0.78f, h - 416f, bgPaint)

        // 4. Power-Up -kuutiot tasojen alla (Keltaiset kysymysmerkkikuutiot)
        val cubePaint = Paint().apply {
            isAntiAlias = true
            color = Color.parseColor("#f59e0b")
        }
        val cubeRect = RectF(w * 0.32f, h - 310f, w * 0.32f + 65f, h - 310f + 65f)
        canvas.drawRoundRect(cubeRect, 10f, 10f, cubePaint)

        cubePaint.color = Color.WHITE
        cubePaint.textSize = 34f
        cubePaint.typeface = Typeface.DEFAULT_BOLD
        cubePaint.textAlign = Paint.Align.CENTER
        canvas.drawText("?", cubeRect.centerX(), cubeRect.centerY() + 12f, cubePaint)

        // 5. Partioiva vihollinen
        val enemyPaint = Paint().apply { isAntiAlias = true; color = Color.parseColor("#f43f5e") }
        val enemyX = (w * 0.45f + Math.sin(now * 0.003) * 120f).toFloat()
        canvas.drawRoundRect(enemyX, h - 230f, enemyX + 55f, h - 180f, 10f, 10f, enemyPaint)
        // Vihollisen heikko yläpinta
        enemyPaint.color = Color.parseColor("#fda4af")
        canvas.drawRect(enemyX + 4f, h - 230f, enemyX + 51f, h - 222f, enemyPaint)

        // 6. Pelaajahahmo (Cyber Runner)
        val playerX = w * 0.22f
        val playerY = h - 245f
        val playerPaint = Paint().apply { isAntiAlias = true; color = Color.parseColor("#38bdf8") }
        canvas.drawRoundRect(playerX, playerY, playerX + 45f, playerY + 65f, 10f, 10f, playerPaint)
        // Silmämikrovisiiri
        playerPaint.color = Color.parseColor("#fef08a")
        canvas.drawRect(playerX + 22f, playerY + 12f, playerX + 42f, playerY + 24f, playerPaint)
        // Viitta / huivi
        playerPaint.color = Color.parseColor("#f43f5e")
        canvas.drawRect(playerX - 16f, playerY + 20f, playerX, playerY + 34f, playerPaint)

        // 7. YLÄREUNAN HUD
        // HULL / Elämät
        textPaint.textSize = 28f
        textPaint.color = Color.parseColor("#94a3b8")
        canvas.drawText("HULL", 40f, 60f, textPaint)
        val heartPaint = Paint().apply { isAntiAlias = true; color = Color.parseColor("#f43f5e") }
        for (i in 0..2) {
            canvas.drawRoundRect(130f + i * 36f, 38f, 158f + i * 36f, 66f, 6f, 6f, heartPaint)
        }

        // KORKEUS (Altitude)
        textPaint.color = Color.parseColor("#38bdf8")
        canvas.drawText("ALT: 42 m ▲", 40f, 105f, textPaint)

        // POWER CUBES -LASKURI (2-kuution sääntö)
        buttonPaint.color = Color.parseColor("#1e293b")
        val cubeHudRect = RectF(w / 2f - 160f, 25f, w / 2f + 160f, 115f)
        canvas.drawRoundRect(cubeHudRect, 20f, 20f, buttonPaint)
        buttonPaint.color = Color.parseColor("#f59e0b")
        buttonPaint.style = Paint.Style.STROKE
        buttonPaint.strokeWidth = 3f
        canvas.drawRoundRect(cubeHudRect, 20f, 20f, buttonPaint)
        buttonPaint.style = Paint.Style.FILL

        textPaint.textAlign = Paint.Align.CENTER
        textPaint.textSize = 24f
        textPaint.color = Color.parseColor("#fbbf24")
        canvas.drawText("⚡ POWER CUBES: 1 / 2", w / 2f, 60f, textPaint)
        textPaint.textSize = 18f
        textPaint.color = Color.parseColor("#94a3b8")
        canvas.drawText("Puske 2 kuutiota alapuolelta", w / 2f, 95f, textPaint)
        textPaint.textAlign = Paint.Align.LEFT

        // Pisteet
        textPaint.textAlign = Paint.Align.RIGHT
        textPaint.textSize = 24f
        textPaint.color = Color.parseColor("#94a3b8")
        canvas.drawText("SCORE", w - 40f, 50f, textPaint)
        textPaint.textSize = 36f
        textPaint.color = Color.parseColor("#fbbf24")
        canvas.drawText("\${score.coerceAtLeast(1450)}", w - 40f, 95f, textPaint)
        textPaint.textAlign = Paint.Align.LEFT

        // 8. KOSKETUSOHJAIMET (Touch-based controls)
        // Vasen D-Pad: [ ◀ ] [ ▶ ]
        buttonPaint.color = Color.parseColor("#dd0f172a")
        canvas.drawRoundRect(40f, h - 160f, 150f, h - 50f, 20f, 20f, buttonPaint)
        canvas.drawRoundRect(170f, h - 160f, 280f, h - 50f, 20f, 20f, buttonPaint)

        buttonTextPaint.textSize = 42f
        canvas.drawText("◀", 95f, h - 90f, buttonTextPaint)
        canvas.drawText("▶", 225f, h - 90f, buttonTextPaint)

        // Oikeat painikkeet: [ B Dash ] ja [ A Jump ]
        // Dash [B]
        buttonPaint.color = Color.parseColor("#d59e0b")
        canvas.drawCircle(w - 230f, h - 105f, 55f, buttonPaint)
        buttonTextPaint.textSize = 34f
        canvas.drawText("B", w - 230f, h - 110f, buttonTextPaint)
        buttonTextPaint.textSize = 18f
        canvas.drawText("DASH", w - 230f, h - 80f, buttonTextPaint)

        // Jump [A]
        buttonPaint.color = Color.parseColor("#10b981")
        canvas.drawCircle(w - 95f, h - 105f, 65f, buttonPaint)
        buttonTextPaint.textSize = 42f
        canvas.drawText("A", w - 95f, h - 110f, buttonTextPaint)
        buttonTextPaint.textSize = 20f
        canvas.drawText("JUMP", w - 95f, h - 75f, buttonTextPaint)

        // Jatka 60 FPS silmukkaa
        postInvalidateOnAnimation()
    }

    override fun onTouchEvent(event: MotionEvent): Boolean {
        val action = event.actionMasked
        val pointerIndex = event.actionIndex
        val pointerId = event.getPointerId(pointerIndex)
        val x = event.getX(pointerIndex)
        val y = event.getY(pointerIndex)

        val activity = context as? MainActivity
        when (action) {
            MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN ->
                activity?.nativeTouchDown(pointerId, x, y)
            MotionEvent.ACTION_MOVE ->
                activity?.nativeTouchMove(pointerId, x, y)
            MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP ->
                activity?.nativeTouchUp(pointerId, x, y)
        }
        return true
    }
}

package com.example.cyberclimber

import android.os.Bundle
import android.view.View
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {

    private lateinit var gameView: GameView

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        // 1. Immersiivinen koko ruudun tila (poistaa ylä- ja alapalkit)
        window.decorView.systemUiVisibility = (
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
            or View.SYSTEM_UI_FLAG_FULLSCREEN
            or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
            or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
            or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
        )

        // 2. Alusta C++ -moottori
        nativeInit()

        // 3. Aseta pelinäkymä suoraan ruudulle (korvaa oletus-Hello Worldin!)
        gameView = GameView(this)
        setContentView(gameView)
    }

    // JNI Native Metodit C++ -moottoriin
    external fun nativeInit()
    external fun nativeTouchDown(pointerId: Int, x: Float, y: Float)
    external fun nativeTouchMove(pointerId: Int, x: Float, y: Float)
    external fun nativeTouchUp(pointerId: Int, x: Float, y: Float)
    external fun nativeUpdate(dt: Float)
    external fun nativeGetState(): Int
    external fun nativeGetScore(): Int
    external fun nativeGetRank(): Char

    // Yhteensopivuus oletuspohjan kanssa (jos jokin vielä kysyy stringFromJNI)
    external fun stringFromJNI(): String

    companion object {
        init {
            System.loadLibrary("cyberclimber")
        }
    }
}

## Miten avaat ja käännät projektin Android Studiossa:
1. Avaa Android Studio ja valitse **New Project** -> **Native C++**.
2. Aseta nimeksi: **CyberClimber** ja Package name: **com.example.cyberclimber**.
3. Kopioi tämän paketin kansio \`app/src/main/cpp/\` omaan projektiisi.
4. Korvaa \`app/src/main/cpp/CMakeLists.txt\` ja \`MainActivity.kt\`.
5. Paina Android Studiossa **Sync Project with Gradle Files**.
6. Klikkaa **Run 'app'** ajaaksesi pelin emulaattorissa tai Android-puhelimellasi!

## Toteutetut mekaniikat:
- **Vaakasiirtymä pystynousuun**: Taso alkaa vaakajuoksuna ja muuttuu pystysuoraksi tornikiipeilyksi.
- **2-Kuution Power-Up**: Tasojen alla oleviin kuutioihin hypätään alapuolelta päällä. Joka 2. kuutio laukaisee Power-Upin.
- **Kiipeävä vaikeustaso**: Sirkkelinterät ja esteet kiihtyvät korkeuden mukaan.
- **Vihollisten poljenta**: Pelaaja tuhoaa partioivat robotit hyppäämällä niiden päälle ja ponnahtaa korkealle.
